{{/*
  KaTeX auto-render — only loaded on pages with `math: true` in front matter.
  Use $$ ... $$ for display math and $ ... $ (or \( ... \)) for inline math.
  No SRI integrity hashes on purpose: a wrong hash makes the browser silently
  refuse to execute the script, which kills all math rendering.
*/}}
<link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"
        onload="renderMathInElement(document.body, {
          delimiters: [
            {left: '$$', right: '$$', display: true},
            {left: '\\[', right: '\\]', display: true},
            {left: '$', right: '$', display: false},
            {left: '\\(', right: '\\)', display: false}
          ],
          throwOnError: false
        });"></script>
