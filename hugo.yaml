baseURL: "https://jothamteo.github.io/quant-research-blog/"
locale: "en-us"
title: "Mark to Model"
theme: "PaperMod"

enableInlineShortcodes: true
enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false
pygmentsUseClasses: true
enableEmoji: false

canonifyURLs: false

minify:
  disableXML: true
  disableJSON: true
  minifyOutput: true

pagination:
  pagerSize: 10

params:
  env: production
  title: "Mark to Model"
  description: "A developer at Pictet writing honest, reproducible quant research — testing the market claims everyone repeats but few people actually check."
  author: "Jotham Teo"
  defaultTheme: "auto"
  disableThemeToggle: false
  ShowReadingTime: true
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowWordCount: true
  ShowToc: true
  TocOpen: true
  comments: false
  hidemeta: false
  hideSummary: false
  ShowRssButtonInSectionTermList: true

  homeInfoParams:
    Title: "Mark to Model"
    Content: |
      Hi, I'm Jotham — a developer at Pictet by day, quant researcher the rest of
      the time. This is where I take the market claims everyone repeats but few
      people actually check, and put them on the bench: does that "edge" survive
      transaction costs? Has that textbook anomaly quietly died? When the data
      disagrees with the popular story, I show you the data.

      MSc Quantitative Finance, with a background spanning finance and software.
      Expect plain-English explanations, honest results (including the dull ones
      and the dead ends), and every chart backed by code you can rerun yourself
      on GitHub.

  socialIcons:
    - name: x
      url: "https://x.com/jothamteo"
    - name: github
      url: "https://github.com/jothamteo"
    - name: rss
      url: "/quant-research-blog/index.xml"

  math: false
  assets:
    disableFingerprinting: false

  cover:
    hidden: false
    hiddenInList: false
    hiddenInSingle: false

  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    keys: ["title", "permalink", "summary", "content"]

menu:
  main:
    - identifier: posts
      name: Posts
      url: /posts/
      weight: 10
    - identifier: about
      name: About
      url: /about/
      weight: 20
    - identifier: search
      name: Search
      url: /search/
      weight: 30
    - identifier: tags
      name: Tags
      url: /tags/
      weight: 40

markup:
  highlight:
    style: "monokai"
    lineNos: false
    codeFences: true
    guessSyntax: true
    noClasses: false
  goldmark:
    renderer:
      unsafe: true
    extensions:
      # Leave $...$ and $$...$$ untouched by Markdown so KaTeX gets clean LaTeX
      # (otherwise Goldmark reads underscores as italics and breaks the math).
      passthrough:
        enable: true
        delimiters:
          block:
            - ["$$", "$$"]
            - ["\\[", "\\]"]
          inline:
            - ["$", "$"]
            - ["\\(", "\\)"]

outputs:
  home:
    - HTML
    - RSS
    - JSON
